dataset: kb_documents
owner: support-ai
freshness:
  column: published_at
  max_delay_minutes: 60
  severity: warning
  action: warn
fields:
  doc_id: {required: true, type: string}
  version: {required: true, type: integer}
  effective_at: {required: true, type: datetime}
  published_at: {required: true, type: datetime}
  source_uri: {required: true, type: string}
  content: {required: true, type: string, min_length: 20}
